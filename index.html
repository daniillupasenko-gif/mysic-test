<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мой музыкальный плеер</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}


/* Затемнение заднего фона */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    z-index: -1;
}


/* ПЛЕЕР */

.player {
    width: 360px;

    background: rgba(24, 24, 24, 0.94);

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.6);

    backdrop-filter: blur(10px);
}


/* ОБЛОЖКА */

.cover {
    width: 100%;

    aspect-ratio: 1 / 1;

    border-radius: 12px;

    object-fit: cover;

    margin-bottom: 20px;
}


/* НАЗВАНИЕ */

.song-name {
    font-size: 22px;

    font-weight: bold;

    margin-bottom: 5px;
}


/* ИСПОЛНИТЕЛЬ */

.artist {
    color: #a7a7a7;

    font-size: 15px;

    margin-bottom: 20px;
}


/* ПРОГРЕСС */

.progress-container {
    width: 100%;
}

.progress {
    width: 100%;

    height: 5px;

    appearance: none;

    background: #535353;

    border-radius: 10px;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}


/* ВРЕМЯ */

.time {
    display: flex;

    justify-content: space-between;

    color: #a7a7a7;

    font-size: 11px;

    margin-top: 6px;
}


/* КНОПКИ */

.controls {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 28px;

    margin-top: 20px;
}


.control {
    border: none;

    background: none;

    color: white;

    cursor: pointer;

    font-size: 25px;

    transition: 0.2s;
}


.control:hover {
    transform: scale(1.12);
}


/* PLAY */

.play {
    width: 58px;

    height: 58px;

    border-radius: 50%;

    border: none;

    background: white;

    color: black;

    font-size: 25px;

    cursor: pointer;

    transition: 0.2s;
}


.play:hover {
    transform: scale(1.07);
}


/* ГРОМКОСТЬ */

.volume {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 20px;
}


.volume input {
    flex: 1;
}


.volume-slider {
    appearance: none;

    height: 4px;

    background: #535353;

    border-radius: 10px;
}


.volume-slider::-webkit-slider-thumb {
    appearance: none;

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}

</style>

</head>


<body>


<div class="player">


    <!-- ОБЛОЖКА -->

    <img
        class="cover"
        id="cover"
        src="poater1.jpg"
        alt="Обложка"
    >


    <!-- НАЗВАНИЕ -->

    <div
        class="song-name"
        id="songName"
    >
        Песня 1
    </div>


    <!-- ИСПОЛНИТЕЛЬ -->

    <div
        class="artist"
        id="artist"
    >
        Исполнитель
    </div>


    <!-- ПРОГРЕСС -->

    <div class="progress-container">

        <input
            type="range"
            class="progress"
            id="progress"

            value="0"
            min="0"
            max="100"
        >


        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <!-- КНОПКИ -->

    <div class="controls">

        <button
            class="control"
            id="prev"
        >
            ⏮
        </button>


        <button
            class="play"
            id="play"
        >
            ▶
        </button>


        <button
            class="control"
            id="next"
        >
            ⏭
        </button>

    </div>


    <!-- ГРОМКОСТЬ -->

    <div class="volume">

        🔊

        <input
            type="range"
            class="volume-slider"

            id="volume"

            min="0"
            max="1"
            step="0.01"

            value="1"
        >

    </div>


</div>


<!-- АУДИО -->

<audio id="audio"></audio>


<script>


/* =========================
   СПИСОК ПЕСЕН
========================= */

const songs = [

    {
        name: "Yesterday",
        artist: "My World",
        file: "song1.mp3",
        cover: "poater1.jpg"
    },

    {
        name: "Only You",
        artist: "My World",
        file: "song2.mp3",
        cover: "poater2.jpg"
    },

    {
        name: "Until Forever",
        artist: "My World",
        file: "song3.mp3",
        cover: "poater3.jpg"
    },

    {
        name: "Always",
        artist: "My World",
        file: "song4.mp3",
        cover: "poater4.jpg"
    },

    {
        name: "Remember",
        artist: "My World",
        file: "song5.mp3",
        cover: "poater5.jpg"
    },

    {
        name: "Everything",
        artist: "My World",
        file: "song6.mp3",
        cover: "poater6.jpg"
    },

    {
        name: "My Love",
        artist: "My World",
        file: "song7.mp3",
        cover: "poater7.jpg"
    },

    {
        name: "You",
        artist: "My World",
        file: "song8.mp3",
        cover: "poater8.jpg"
    },

    {
        name: "With You",
        artist: "My World",
        file: "song9.mp3",
        cover: "poater9.jpg"
    },

    {
        name: "One Heart",
        artist: "My World",
        file: "song10.mp3",
        cover: "poater10.jpg"
    },

    {
        name: "Romance",
        artist: "My World",
        file: "song11.mp3",
        cover: "poater11.jpg"
    },

    {
        name: "Love",
        artist: "My World",
        file: "song12.mp3",
        cover: "poater12.jpg"
    },

    {
        name: "Dream",
        artist: "My World",
        file: "song13.mp3",
        cover: "poater13.jpg"
    }

];


let currentSong = 0;


const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const volume =
    document.getElementById("volume");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const cover =
    document.getElementById("cover");

const songName =
    document.getElementById("songName");

const artist =
    document.getElementById("artist");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");


/* =========================
   ЗАГРУЗКА ПЕСНИ
========================= */

function loadSong(index) {

    currentSong = index;

    const song =
        songs[currentSong];


    audio.src =
        song.file;


    cover.src =
        song.cover;


    songName.textContent =
        song.name;


    artist.textContent =
        song.artist;


    progress.value = 0;

    currentTime.textContent =
        "0:00";

    duration.textContent =
        "0:00";

}


/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener(
    "click",
    () => {

        if (audio.paused) {

            audio.play();

            playButton.textContent =
                "⏸";

        } else {

            audio.pause();

            playButton.textContent =
                "▶";

        }

    }
);


/* =========================
   СЛЕДУЮЩАЯ ПЕСНЯ
========================= */

nextButton.addEventListener(
    "click",
    () => {

        currentSong++;


        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }


        loadSong(currentSong);


        audio.play();


        playButton.textContent =
            "⏸";

    }
);


/* =========================
   ПРЕДЫДУЩАЯ ПЕСНЯ
========================= */

prevButton.addEventListener(
    "click",
    () => {

        currentSong--;


        if (currentSong < 0) {

            currentSong =
                songs.length - 1;

        }


        loadSong(currentSong);


        audio.play();


        playButton.textContent =
            "⏸";

    }
);


/* =========================
   ПРОГРЕСС
========================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (audio.duration) {

            progress.value =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;


            currentTime.textContent =
                formatTime(
                    audio.currentTime
                );

        }

    }
);


/* =========================
   ДЛИТЕЛЬНОСТЬ
========================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================
   ПЕРЕМАТЫВАНИЕ
========================= */

progress.addEventListener(
    "input",
    () => {

        if (audio.duration) {

            audio.currentTime =
                (
                    progress.value /
                    100
                ) *
                audio.duration;

        }

    }
);


/* =========================
   ГРОМКОСТЬ
========================= */

volume.addEventListener(
    "input",
    () => {

        audio.volume =
            volume.value;

    }
);


/* =========================
   АВТОПЕРЕКЛЮЧЕНИЕ
========================= */

audio.addEventListener(
    "ended",
    () => {

        currentSong++;


        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }


        loadSong(currentSong);


        audio.play();

    }
);


/* =========================
   ФОРМАТ ВРЕМЕНИ
========================= */

function formatTime(seconds) {

    if (isNaN(seconds)) {

        return "0:00";

    }


    let minutes =
        Math.floor(
            seconds / 60
        );


    let secs =
        Math.floor(
            seconds % 60
        );


    if (secs < 10) {

        secs =
            "0" + secs;

    }


    return minutes + ":" + secs;

}


/* =========================
   ПЕРВАЯ ПЕСНЯ
========================= */

loadSong(0);

</script>


</body>
</html>
